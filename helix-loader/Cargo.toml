[package]
name = "helix-loader"
description = "Build bootstrapping for Helix crates"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hx-loader"
path = "src/main.rs"

[dependencies]
helix-stdx = { path = "../helix-stdx" }

anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
once_cell = "1.21"
log = "0.4"

tree-house.workspace = true

[target.'cfg(target_os = "motor")'.dependencies]
helix-static-grammars = { path = "../helix-static-grammars", features = ["static-grammars"] }
tree-house-bindings = { version = "=0.2.4", default-features = false, features = ["tree-sitter-language"] }

[target.'cfg(not(target_os = "motor"))'.dependencies]
# Cloning and compiling shared tree-sitter grammars.
cc = { version = "1" }
etcetera = "0.10"
tempfile.workspace = true
threadpool = { version = "1.0" }

[dev-dependencies]
helix-static-grammars = { path = "../helix-static-grammars" }
